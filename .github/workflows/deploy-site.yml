name: Refresh data and deploy site

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: Build and deploy even when the content is unchanged
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: read
    outputs:
      deploy: ${{ steps.changes.outputs.deploy }}
      fingerprint: ${{ steps.changes.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Recheck Forever talents
        run: npm run data:refresh
      - name: Verify the data pipeline
        run: npm test
      - name: Restore the previous guild snapshot
        id: guild-cache
        uses: actions/cache/restore@v6.1.0
        with:
          path: site/public/data
          key: forever-eu-80523-pve-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: forever-eu-80523-pve-v2-
      - name: Refresh the live Forever guild
        run: npm run data:live -- --allow-authenticated-blizzard --from-env --require-roster
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          BLIZZARD_REGION: eu
          BLIZZARD_RULESET: pve
          BLIZZARD_GUILD_ID: '80523'
          BLIZZARD_GUILD_SLUG: flaccid-sails
          BLIZZARD_GUILD_NAME: Flaccid Sails
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
      - name: Restore the last successful deployment fingerprint
        uses: actions/cache/restore@v6.1.0
        with:
          path: .cache/site-deployment/fingerprint
          key: forever-site-deployed-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: forever-site-deployed-v1-
      - name: Check whether the published content changed
        id: changes
        run: node scripts/deployment-plan.mjs
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          ARTWORK_BASE_URL: https://flaccid-sails.github.io/site-assets/v1/
          FORCE_DEPLOY: ${{ inputs.force_deploy == true }}
      - name: Build the live site with static JSON
        if: steps.changes.outputs.deploy == 'true'
        run: npm run build
        env:
          SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          ARTWORK_BASE_URL: https://flaccid-sails.github.io/site-assets/v1/
      - name: Commit the successful talent check to main
        shell: bash
        run: bash scripts/save-talents.sh
      - name: Upload site
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/dist
      - name: Save the successful guild snapshot
        uses: actions/cache/save@v6.1.0
        with:
          path: site/public/data
          key: ${{ steps.guild-cache.outputs.cache-primary-key }}
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Record the successful deployment fingerprint
        env:
          DEPLOYED_FINGERPRINT: ${{ needs.build.outputs.fingerprint }}
        run: |
          mkdir -p .cache/site-deployment
          printf '%s\n' "$DEPLOYED_FINGERPRINT" > .cache/site-deployment/fingerprint
      - name: Save the successful deployment fingerprint
        uses: actions/cache/save@v6.1.0
        with:
          path: .cache/site-deployment/fingerprint
          key: forever-site-deployed-v1-${{ github.run_id }}-${{ github.run_attempt }}
